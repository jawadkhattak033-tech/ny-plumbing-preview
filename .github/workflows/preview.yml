# Builds the client preview and publishes it to GitHub Pages.
# The preview build (PREVIEW=true) adds noindex, a preview banner and a
# disabled form, and serves the site under /<repo>/. The Hostinger build
# (plain `npm run build`) is not affected.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # Site and base for https://jawadkhattak033-tech.github.io/ny-plumbing-preview/
      - name: Build preview
        run: npm run build
        env:
          PREVIEW: 'true'
          PREVIEW_SITE: https://jawadkhattak033-tech.github.io
          PREVIEW_BASE: /ny-plumbing-preview

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
